name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # YAML anchors that span `jobs` are rejected by GitHub Actions, so each
  # macOS job lists the shared setup steps explicitly.
  test:
    name: Clippy and tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # vendor/ghostty's build.zig.zon requires Zig 0.17.0. setup-zig also
      # caches Zig's global cache, which is where the libghostty-vt artifacts
      # live between runs.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
          key: test
          cache-on-failure: true

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node --test src/agent/integration/adapters.test.mjs

  package:
    name: Release build and package
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # A separate cache key keeps the release profile's artifacts from being
      # evicted or overwritten by the dev-profile test runs (and vice versa)
      # when both jobs run in parallel.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
          key: release
          cache-on-failure: true

      # The release binary is what packaging/make-app.sh bundles and signs.
      - run: cargo build --release --locked
      - run: packaging/make-app.sh release --no-build
      - run: ditto -c -k --keepParent target/release/Kumu.app target/release/Kumu.app.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Kumu-app-${{ runner.arch }}
          path: target/release/Kumu.app.zip
          if-no-files-found: error
