[package]
name = "kumu"
version = "0.1.5"
edition = "2024"

[dependencies]
futures = "0.3"
ghostty-sys = { path = "crates/ghostty-sys" }
gpui-kit = "0.6"
# gpui-kit 0.6 and its updater must share this compatible GPUI backend.
gpui = { package = "gpui-pre", version = "=0.3.4" }
gpui-updater = { package = "gpui-updater-pre", version = "0.4.4" }
portable-pty = "=0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# `cargo run` launches a bare binary, not a `.app` bundle, so macOS shows the
# generic executable icon in the Dock. src/dock_icon.rs sets kumu's own icon on
# the shared NSApplication at launch instead (packaging/make-app.sh builds a
# real bundle, whose CFBundleIconFile owns the icon); only macOS needs these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Dependencies are optimized even in dev builds: unoptimized GPUI layout, text
# shaping and markdown parsing make `cargo run` visibly stutter, while kumu's
# own crate stays at opt-level 0 so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3
