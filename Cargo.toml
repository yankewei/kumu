[package]
name = "kumu"
version = "0.1.51"
edition = "2024"
license = "MIT"
repository = "https://github.com/yankewei/kumu"

[dependencies]
anyhow = "1"
futures = "0.3"
ghostty-sys = { path = "crates/ghostty-sys" }
# Shared GPUI backend for nsh-platform-gpui and Kumu's Ghostty VT TerminalView.
gpui = { package = "gpui-fast", version = "0.1.17", default-features = false, features = ["font-kit"] }
gpui-platform = { package = "gpui-fast-platform", version = "0.1.17" }
gpui-updater-core = "0.4.4"
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "ebfdfad", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "ebfdfad", default-features = false, features = ["editor", "highlight"] }
nsh-platform-gpui = { git = "https://github.com/longbridge/nsh", rev = "ebfdfad", default-features = false, features = ["editor", "highlight", "svg", "runtime-shaders"] }
portable-pty = "=0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = "0.10"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }

[dev-dependencies]
gpui = { package = "gpui-fast", version = "0.1.17", default-features = false, features = ["font-kit", "test-support"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "ebfdfad", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "ebfdfad", default-features = false }

# `cargo run` launches a bare binary, not a `.app` bundle, so macOS shows the
# generic executable icon in the Dock. src/dock_icon.rs sets kumu's own icon on
# the shared NSApplication at launch instead (packaging/make-app.sh builds a
# real bundle, whose CFBundleIconFile owns the icon); only macOS needs these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Dependencies are optimized even in dev builds: unoptimized GPUI layout, text
# shaping and markdown parsing make `cargo run` visibly stutter, while kumu's
# own crate stays at opt-level 0 so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 3
